backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - name: "content"
        label: "Edit Website"
        file: "content.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Headline Line 1", name: "title_line1", widget: "string"}
              - {label: "Headline Line 2 (highlighted in red)", name: "title_line2", widget: "string"}
              - {label: "Subheading", name: "subtitle", widget: "text"}
              - {label: "Hero Photo", name: "image", widget: "image"}
              - {label: "Photo Alt Text", name: "image_alt", widget: "string", required: false}
              - {label: "Sticky Note Text", name: "note_text", widget: "string"}
              - {label: "Est. Tag", name: "est_tag", widget: "string"}
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - {label: "Headline Line 1", name: "title_line1", widget: "string"}
              - {label: "Headline Line 2 (highlighted in red)", name: "title_line2", widget: "string"}
              - {label: "Body Paragraph", name: "body", widget: "text"}
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Email", name: "email", widget: "string"}
          - label: "Design Projects"
            name: "design"
            widget: "list"
            fields: &project_fields
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Tag / Subcategory", name: "subtitle", widget: "string"}
              - {label: "One-line Description", name: "desc", widget: "string"}
              - {label: "Image (or video cover image)", name: "image", widget: "image"}
              - {label: "Video (optional MP4, plays in a pop-up when the card is clicked)", name: "video", widget: "file", required: false, media_folder: "/videos", public_folder: "/videos"}
              - {label: "Image Fit (Contain = full-width strip for icons, Wide = full-width showcase for big layouts, Letterbox = show the whole image inside the card without cropping)", name: "fit", widget: "select", options: ["cover", "letterbox", "contain", "wide"], default: "cover", required: false}
          - label: "Instructional Design Projects"
            name: "instructional_design"
            widget: "list"
            fields: *project_fields
          - label: "Illustration Projects"
            hint: "Use Tag / Subcategory for things like Corporate, Sketchbook, Miscellaneous."
            name: "illustration"
            widget: "list"
            fields:
              - {label: "Subsection Name", name: "subtype", widget: "string"}
              - label: "Pieces In This Subsection"
                name: "items"
                widget: "list"
                fields: *project_fields
          - label: "Caricature Projects"
            hint: "Grouped by subtype. Each subtype is its own labeled row on the site. Add pieces inside the matching subtype, or add a whole new subtype group."
            name: "caricature"
            widget: "list"
            fields:
              - {label: "Subtype Name", name: "subtype", widget: "string"}
              - label: "Pieces In This Subtype"
                name: "items"
                widget: "list"
                fields: *project_fields
          - label: "Animation Reel (featured video at the top of Animation)"
            name: "animation_reel"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
              - {label: "Video (MP4)", name: "video", widget: "file", media_folder: "/videos", public_folder: "/videos"}
              - {label: "Cover Image", name: "poster", widget: "image"}
          - label: "Animation Projects"
            hint: "Two subsections: Animation, and Behind the Animation (storyboards and character drawings that support the animations)."
            name: "animation"
            widget: "list"
            fields:
              - {label: "Subsection Name", name: "subtype", widget: "string"}
              - label: "Pieces In This Subsection"
                name: "items"
                widget: "list"
                fields: *project_fields
          - label: "Pen and Paint"
            hint: "Traditional art, 3D, or anything else that doesn't fit the other buckets."
            name: "misc"
            widget: "list"
            fields: *project_fields
